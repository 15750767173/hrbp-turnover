<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>众辉科技 · 人员入离职工作台</title>
<style>
  :root{
    --bg:#0f172a; --card:#17233b; --line:#243352; --txt:#e8eefc; --dim:#8fa3c8;
    --acc:#2f6df6; --acc2:#1b4fd1; --err:#ff6b6b;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f3f6fc; --card:#ffffff; --line:#dfe6f3; --txt:#17233b; --dim:#64748b;
           --acc:#2f6df6; --acc2:#1b4fd1; --err:#d92d20; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .card{
    width:100%;max-width:392px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:30px 28px 24px;box-shadow:0 18px 48px rgba(9,17,34,.18);
  }
  .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--acc),#7aa2ff);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#fff;
    letter-spacing:.5px;margin-bottom:18px}
  h1{font-size:19px;line-height:1.35;margin:0 0 6px;font-weight:650}
  .sub{color:var(--dim);font-size:13px;margin:0 0 22px}
  label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:7px}
  input{
    width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
    background:transparent;color:var(--txt);font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(47,109,246,.16)}
  button{
    width:100%;margin-top:14px;padding:12px 14px;border:0;border-radius:10px;cursor:pointer;
    background:linear-gradient(180deg,var(--acc),var(--acc2));color:#fff;font-size:15px;font-weight:600;
    transition:opacity .15s,transform .06s;
  }
  button:active{transform:translateY(1px)}
  button[disabled]{opacity:.6;cursor:default}
  .msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--dim)}
  .msg.err{color:var(--err)}
  .foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);color:var(--dim);font-size:11.5px;
    display:flex;justify-content:space-between;gap:10px}
  .foot a{color:var(--dim);text-decoration:none;border-bottom:1px dotted var(--line)}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(127,150,190,.35);
    border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">众</div>
  <h1>人员入离职分析工作台</h1>
  <p class="sub">内部数据 · 需访问密码</p>
  <div id="form">
    <label for="pw">访问密码</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="请输入访问密码" autofocus>
    <button id="go">进 入</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="foot">
    <span>众辉科技 · 人力资源</span>
    <a href="javascript:;" id="forget" class="hide">清除本机记忆</a>
  </div>
</div>
<script>
(function(){
  'use strict';
  var SALT_B64 = 'mW9KTlhhxOZZbnZelQGJAg==';
  var ITER = 310000;
  var VER = '74fa9ffc';
  var STAMP = '2026-11-21 18:04';
  var LS = 'tw.gh.v1';

  var $ = function(id){ return document.getElementById(id); };
  var msgEl = $('msg'), goEl = $('go'), pwEl = $('pw'), formEl = $('form'), forgetEl = $('forget');

  function b64d(s){
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function b64e(u8){
    var s = '', CH = 0x8000;
    for (var i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
    return btoa(s);
  }
  function say(t, isErr, spinning){
    msgEl.className = 'msg' + (isErr ? ' err' : '');
    msgEl.innerHTML = (spinning ? '<span class="spin"></span>' : '') + (t || '');
  }
  function busy(on){
    goEl.disabled = !!on;
    goEl.textContent = on ? '解密中…' : '进 入';
  }

  if (!window.crypto || !window.crypto.subtle) {
    say('当前浏览器不支持解密（需 https 或 Chrome / Edge / 新版 Safari）', true);
    busy(true);
    return;
  }

  function deriveKey(pw){
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function(base){
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64d(SALT_B64), iterations: ITER, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      });
  }

  function reveal(key){
    var canGz = (typeof DecompressionStream !== 'undefined');
    var url = (canGz ? 'payload.gz.enc' : 'payload.enc') + '?v=' + VER;
    return fetch(url, { cache: 'force-cache', credentials: 'omit' }).then(function(res){
      if (!res.ok) throw new Error('LOAD_' + res.status);
      return res.arrayBuffer();
    }).then(function(buf){
      var iv = new Uint8Array(buf, 0, 12);
      var ct = new Uint8Array(buf, 12);
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    }).then(function(plain){
      var u8 = new Uint8Array(plain);
      if (!canGz) return new TextDecoder('utf-8').decode(u8);
      var stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream).text();
    }).then(function(html){
      if (!html || html.indexOf('<') !== 0) throw new Error('BAD_PAYLOAD');
      document.open();
      document.write(html);
      document.close();
    });
  }

  function fail(e){
    busy(false);
    var code = (e && e.name) || '';
    if (code === 'OperationError') { say('密码不正确，请重试', true); return; }
    if (String(e && e.message).indexOf('LOAD_') === 0) { say('数据文件加载失败，请刷新重试', true); return; }
    if (code === 'QuotaExceededError' || code === 'SecurityError') { say('浏览器存储受限，已切换为手动输入', true); return; }
    say('打开失败：' + ((e && e.message) || e), true);
  }

  function remember(key){
    try {
      return crypto.subtle.exportKey('raw', key).then(function(raw){
        localStorage.setItem(LS, JSON.stringify({ s: SALT_B64, k: b64e(new Uint8Array(raw)), t: Date.now() }));
      });
    } catch (e) { return Promise.resolve(); }
  }

  function tryCached(){
    var raw = null;
    try { raw = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { raw = null; }
    if (!raw || raw.s !== SALT_B64 || !raw.k) return Promise.resolve(false);
    forgetEl.classList.remove('hide');
    busy(true);
    say('正在打开…', false, true);
    return crypto.subtle.importKey('raw', b64d(raw.k), { name: 'AES-GCM' }, true, ['decrypt'])
      .then(reveal)
      .then(function(){ return true; })
      .catch(function(){
        try { localStorage.removeItem(LS); } catch (e) {}
        busy(false);
        say('记忆已失效，请重新输入密码');
        return false;
      });
  }

  goEl.addEventListener('click', function(){
    var pw = (pwEl.value || '').trim();
    if (!pw) { say('请输入访问密码', true); pwEl.focus(); return; }
    busy(true);
    say('正在解密…', false, true);
    deriveKey(pw).then(function(key){
      return remember(key).then(function(){ return reveal(key); });
    }).catch(fail);
  });
  pwEl.addEventListener('keydown', function(e){ if (e.key === 'Enter') goEl.click(); });
  forgetEl.addEventListener('click', function(e){
    e.preventDefault();
    try { localStorage.removeItem(LS); } catch (err) {}
    forgetEl.classList.add('hide');
    say('已清除，下次需输入密码');
    pwEl.focus();
  });

  if (STAMP) { try { document.title = '众辉科技 · 人员入离职工作台'; } catch (e) {} }

  tryCached().then(function(done){
    if (!done) { try { pwEl.focus(); } catch (e) {} }
  });
})();
</script>
</body>
</html>
